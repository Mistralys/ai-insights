slug: ledger-pipeline-configurator
name: "Ledger Pipeline Configurator"
description: "Determine which pipeline stages should be active for each Work Package based on the nature of the work."
vs_file_name: ledger-pipeline-configurator.agent.md
id: standalone-ledger-pipeline-configurator
cc_file_name: ledger-pipeline-configurator.md
audit_guide_version: "3.4"
audit_date: "2026-08-28"

changelog: |
  1.4.0 (2026-10-08): Added a Baseline-Capture Chain — a WP whose deliverable is an early diff-oracle
    snapshot always gets ["implementation", "qa"], never verification-only, cross-referenced from the
    verification-only chain's state-changing-operations pre-requisite as an exception
  1.3.0 (2026-10-06): Verification-only chain withdrawn — a verifier with no `implementation` stage
    has nobody to fix what it flags, so the ledger loops the WP back to the same verifier (incident:
    hcp-editor WP-019, an exit gate on `["qa", "code-review"]`). New Decision Criteria block and
    constraint: `qa`, `security-audit` and `code-review` require `implementation`. A WP with nothing
    to author gets the standard chain as a placeholder plus the fixed Guardrail Notes flag
    `Decomposition defect — no authoring work`, which the PM searches for before bootstrap. Triage,
    Guardrail Notes, Output Template and Quality Checklist updated to match; the CLI side-effect
    checklist item went with the chain
  1.2.3 (2026-09-30): Changelogs dropped from the documentation-only chain — they are the Release
    Engineer's, and the chain contradicted both the `release-engineering` criteria and the new
    authoring pre-requisite; a docs-plus-changelog WP now runs release-engineering then documentation
  1.2.2 (2026-09-30): Every deliverable needs a stage that writes it — synthesis lesson from a WP
    whose docs, manifest and changelog deliverables were given a verification-only chain, which left
    QA to author and then check its own work. The verification-only pre-requisite now names docs,
    manifests and changelog entries alongside code; a new authoring pre-requisite maps them to
    `documentation` and `release-engineering`; plus a matching constraint, triage flag and checklist item
  1.2.1 (2026-09-18): Added cc_tools override — the builder resolves cc_tools → tools and never falls
    through to default_cc_tools, so the VS Code tool names reached the Claude Code frontmatter verbatim
    and a `--agent` session opened with no Read, Grep or Glob at all; Task omitted, since this persona
    dispatches no sub-agents
  1.2.0 (2026-08-28): First full audit (guide v3.4) — 14 findings, all resolved. Inputs rewritten to match the PM's single-folder-path dispatch contract, replacing the four-item list and the "if the plan document is available" hedge. Added an Operating Philosophy with four principles, two of them the canonical "The Upstream Stage Already Looked" and "A Few Right Files Beat Many" (C5c). Added a Codebase Verification capability — the narrowing pre-requisites always required reading source that Capabilities never authorised. Split the fused classify-and-verify workflow step into triage / verify / assign per Pattern 14, and gave the Guardrail Notes slot an explicit nothing-found form so a clean run reads differently from a skipped one. Decision Criteria gained its own Constraints block; headings de-imperativised; handoff now emits the full persona name
  1.1.0 (2026-07-09): Verification-only chain gains state-changing operation pre-requisite; Workflow Step 2 adds AC coverage check for CLI commands; quality checklist item added for side-effect verification
  1.0.2 (2026-05-18): Write step references Output Location; subagent handoff precision improved
  1.0.1 (2026-04-30): Overall improvements
  1.0.0 (2026-04-11): Initial release — pipeline stage activation per Work Package type

tools:
  - read
  - edit
  - search

# cc_tools: explicit list required — the builder resolves cc_tools from
# cc_tools → tools (never default_cc_tools), so the VS Code tools list
# would be used otherwise, and none of its names resolve under Claude Code.
# No Bash and no web access, matching the narrow vs-code grant.
cc_tools:
  - Read
  - Edit
  - Write
  - Grep
  - Glob

# overview metadata
identity: "Technical Program Manager — Pipeline Stage Analyst"
use_when: "Invoked by the Project Manager to determine which pipeline stages each WP should go through"
