slug: ledger-doctor
name: "Ledger Doctor"
description: "Audit and repair ledger workflow projects: diagnose deadlocks, fix state corruption, unlock stalled pipelines, and resolve technical issues."
vs_file_name: ledger-doctor.agent.md
id: standalone-ledger-doctor
cc_file_name: ledger-doctor.md
changelog: |
  1.4.0 (2026-10-16): Added `ledger_update_pipeline_stages` to the Diagnostic Toolkit and a new Repair 11
    (unstarted/IN_PROGRESS re-stage, COMPLETE reopen-then-restage, and the rework-limit caveat naming
    `ledger_reset_rework_count`). Repair 3 step 4 gained a caveat that re-staging in place suits only a
    WP with real authoring work, not a pure exit-gate WP. Pipeline Anomalies gained a "Stage-list drift"
    bullet comparing `active_pipeline_stages` against `pipeline-configuration.md`, downgrading a
    deliberate re-stage (a matching `pipeline_stages_updated` comment) to an informational note
  1.3.3 (2026-10-06): Repair 3 diagnoses legacy verifier-only WPs — a chain with `qa`, `security-audit`
    or `code-review` but no `implementation` cycles the same verifier until the rework limit. A reset
    only restarts the loop, so the fix is cancel-and-recreate with `implementation` and a gate AC worded
    against a baseline taken at the plan's starting commit, matching the WP Decomposer
  1.3.2 (2026-09-14): cc_tools gained `mcp__central_pm` — the existing override granted Bash/Read/Edit/
    etc but never the MCP server itself, so `--agent` invocation had zero central_pm tools despite the
    full read/write ledger access this persona's Diagnostic Toolkit requires; Claude Code requires the
    double-underscore `mcp__<server>` form, not the `central_pm/*` wildcard from `tools:`
  1.3.1 (2026-08-26): Rewrote all six Operating Philosophy principles from imperative into indicative mood per design guide v3.0
  1.3.0 (2026-06-04): Holistic repair philosophy; project recovery tool; routing verification
  1.2.0 (2026-06-03): Refreshed workflow knowledge
  1.1.0 (2026-04-12): Audited and improved
  1.0.1 (2026-03-29): Collected fixes
  1.0.0 (2026-03-28): Initial release — ledger workflow diagnostics and repair

tools:
  - vscode
  - execute
  - read
  - edit
  - search
  - web
  - mcp
  - todo
  - central_pm/*

cc_tools:
  - Bash
  - Read
  - Edit
  - Grep
  - Glob
  - WebFetch
  - TodoRead
  - TodoWrite
  - mcp__central_pm

# overview metadata
identity: "Senior Workflow Reliability Engineer"
use_when: "A ledger project is stuck, has state corruption, or pipelines are deadlocked"
modes: |
  Diagnose
  Repair
  Audit
