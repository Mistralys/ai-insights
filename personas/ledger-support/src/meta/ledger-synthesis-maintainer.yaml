slug: ledger-synthesis-maintainer
name: "Ledger Synthesis Maintainer"
description: "Archive a completed standalone plan folder into the project ledger, or refresh the ledger record of any completed project after its synthesis.md was edited."
vs_file_name: ledger-synthesis-maintainer.agent.md
id: ledger-support-synthesis-maintainer
cc_file_name: ledger-synthesis-maintainer.md
changelog: |
  2.0.0 (2026-09-23): BREAKING — renamed from Ledger Standalone Archiver to Ledger Synthesis Maintainer
    (slug `standalone-archiver` -> `ledger-synthesis-maintainer`, matching the suite's `ledger-` prefix;
    id and output filenames follow); Update mode
    is now runner-agnostic and maintains the ledger synthesis record of any COMPLETE project, matching
    the relaxed runner guard on `ledger_update_synthesis`; Import mode renamed to Archive mode and stays
    standalone-only, since `ledger_import_standalone` is what creates a standalone record
  1.7.1 (2026-09-14): Added `cc_tools` override with explicit `mcp__central_pm__ledger_import_standalone`
    and `mcp__central_pm__ledger_update_synthesis` grants — the raw `central_pm/ledger_*` entries in
    `tools:` are VS Code-only syntax and never resolve under Claude Code `--agent` invocation, which
    requires the double-underscore `mcp__<server>__<tool>` form; kept narrow (no server-level wildcard)
    to mirror the persona's existing two-tool allowlist
  1.7.0 (2026-08-21): Exclude insights.jsonl from import sources and archived-file reporting alongside scenario-coverage.md
  1.6.0 (2026-08-18): Preserve optional usage-scenarios.md source companions while excluding generated scenario-coverage.md from standalone archival
  1.5.0 (2026-07-16): Extracted summary-crafting guidelines to shared partial
  1.4.0 (2026-07-13): Audit compliance — added Operating Modes section (Import/Update); split workflow into mode-specific sections; added constraint alternatives; renamed MCP Tools to MCP Server Tools
  1.3.0 (2026-07-13): Added ledger_update_synthesis tool for updating synthesis after post-import edits
  1.2.0 (2026-07-03): Added read and edit tools for synthesis.md archival date stamp
  1.1.0 (2026-07-03): Audit compliance — added Strict Constraints section, Capabilities sub-section, handoff block; removed separators and meta-commentary; refactored workflow to numbered list format
  1.0.2 (2026-07-03): After successful import, stamp "Archived in Ledger: YYYY-MM-DD" into synthesis.md Completion Status section
  1.0.1 (2026-07-03): Renamed to Ledger Standalone Archiver for consistency with other ledger-support agents
  1.0.0 (2026-07-01): Initial release — import standalone plan folders into the ledger via ledger_import_standalone

tools:
  - read
  - edit
  - central_pm/ledger_import_standalone
  - central_pm/ledger_update_synthesis

# cc_tools: explicit list required — the builder resolves cc_tools from
# cc_tools → tools (never default_cc_tools), so the VS Code tools list
# would be used otherwise, which carries `central_pm/ledger_*` (VS
# Code-only syntax that Claude Code's `--agent` tool matcher never
# resolves). Explicit per-tool `mcp__<server>__<tool>` grants mirror
# the narrow two-tool VS Code allowlist rather than a server wildcard.
cc_tools:
  - Read
  - Edit
  - mcp__central_pm__ledger_import_standalone
  - mcp__central_pm__ledger_update_synthesis

# overview metadata
identity: "Ledger Archivist"
use_when: "A completed standalone plan should be tracked in the project ledger, or an edited synthesis.md needs its ledger record refreshed"
modes: |
  Archive
  Update
