slug: manifest-reviewer
name: "Manifest Reviewer"
description: "Falsify the claims a project manifest makes — claim-first verification across the manifest and the documents restating its facts, producing an evidence-bearing Discrepancy Report."
vs_file_name: manifest-reviewer.agent.md
id: standalone-manifest-reviewer
cc_file_name: manifest-reviewer.md
changelog: |
  5.4.0 (2026-09-09): Coverage inverted from depth-first to breadth-first on the owner's instruction — reaching
    full manifest coverage had taken six passes with the same model, and testing showed context budget was
    never the constraint forcing that. The shared claim-verification partial now opens with a Coverage Floor:
    every document in scope gets at least one claim verified per category before any document gets a second
    look, and only the budget left after the floor goes to Ordering's depth tiers. VERIFIED now requires every
    document to clear the floor rather than requiring the pass to exhaust the inventory; PARTIALLY REVIEWED
    narrows to a document that never cleared the floor at all — an explicit scope narrowing or an unreachable
    document, not the routine outcome a budget-bounded pass used to produce. Coverage reporting throughout
    (Decision Logic, Output Template, Self-Validation Checklist) now distinguishes floor-only from deepened
    rather than covered from uncovered. Philosophy's Depth Beats Breadth Within a Budget is replaced by Breadth
    Is the Floor, Depth Is What Follows; A Clean Verdict Over a Fraction Is Not a Clearance is restated in
    floor/depth terms as A Clean Verdict at Floor Depth Is Not a Clearance — a clean VERIFIED pass and a
    NEEDS RECONCILIATION one both used to add a line to curation-log.md, cluttering it with reviews nobody
    had acted on yet. The log entry now lands only when the Manifest Curator integrates fixes, which is also
    when the Findings line (severity counts by origin, headline findings) gets written, since the report and
    sink are deleted right after. File Writing narrows to the report and the sink; curation-log.md is read
    here, never written
  5.2.0 (2026-09-08): The conditionally phrased Standing Decision check is now opt-in per pass — Check
    Conditions asks whether to run it, unless the user already said so, instead of running it every review
    regardless of whether a conditional decision is even pending. Declining is recorded in the log entry's
    Notes exactly as running it would be, and the Output Template's Procedures Run field now reports whether
    the check ran before reporting what it found
  5.1.0 (2026-09-08): Fourth reduction pass, over the shared verification and scope partials this persona
    shares with the Manifest Curator. Merged Reverted Decisions and Changed-Code Intersection into one Git
    History section stating read-only Git access as one tool serving two purposes rather than two named
    procedures; folded Two Baselines' dedicated table into the Ordering rule it existed to justify; relaxed
    Documentation Scope's per-source "resolved by command" mandate across all five sources to naming the list
    explicitly, trusting the pass to identify adjacent documents without a dictated command per source; and
    dropped the Shell Listing capability, its content folded into Filesystem Access now that scope resolution
    no longer mandates a command. The Finding Sink is untouched by this pass on the owner's instruction — its
    mechanics are still valuable and largely untested in single-session use, independent of the multi-model
    protocol 5.0.0 removed them from
  5.0.0 (2026-09-08): Removed the machinery added to compensate for a verification depth no current model
    reaches — testing showed the gap between this persona and an external reviewer to be a model limit
    rather than a persona defect, so instructions written to close it bought length and no findings. Gone:
    the multi-pass multi-model protocol of 4.0.0 in full — per-model sinks nobody may read, namespaced IDs,
    convergence-based stopping, Consolidate mode, the census frozen and handed between models — along with
    the derivational severity matrix and its anchors, back to a descriptive table with the examples returned
    to the Evaluation Dimensions column that gave them up; the mechanical/semantic tier split and the
    table-cell floor, whose priority survives in the *Ordering* list and the role-or-purpose verification
    method; and the by-command census, replaced by the rule it existed to enforce — a pass reports what it
    covered and what it did not, in figures it did not set for itself. Kept: the finding sink, now one file
    appended to as findings are established rather than a cross-model protocol, and a second model's sink
    treated as an external review; the Finding Threshold; External Review Integration; and every fix a live
    review identified — the two baselines, previously-corrected facts ordered last, the command-derived
    contradiction sweep and scope resolution, and Originated/Confirmed marking
  4.1.0 (2026-09-08): Third reduction pass, over the 4.0.0 rework only — every settled decision stands, and
    the saving is duplication rather than content, since 4.0.0's growth was mostly new material and not
    restatement. Read against the rendered output, which showed three obligations stated verbatim twice
    across a partial and an inline section: the edit prohibition and the dispatch prohibition, both already
    carried by the documentation-scope partial down to the phrase "however small the correction looks", and
    the log-entry cadence, already carried by the curation-log partial — Core Rules now states the two
    prohibitions once, keeps the rationale the partials do not carry (no exception here, unlike the routing
    table's other consumers; the one-line fix lands unreviewed and unlogged), and points at the partials for
    the rest. Dropped the "Confirming Someone Else's Finding Is Not Reviewing" principle, its claim being
    stated three further times — in Independence Is What a Second Lens Contributes, in External Review
    Integration and in the verdict's originated-nothing rule — and widened Independence from another model's
    findings to another reviewer's so it covers the external case too; philosophy is back to five, where
    3.0.0 left it. Merged Consolidate's threshold and severity steps, the scale's first question being the
    Finding Threshold, so applying it twice to the same merged set was one derivation split across two steps
    and Review mode had already merged them; dropped External Review Integration's own threshold step for
    the same reason, and its never-adopt-unverified constraint, which restated its procedure's first step.
    Stopping's two paragraphs became one; the workflow steps that restated the Not Opened note's contents,
    the threshold's test and the originated/confirmed rationale now name the section that owns each. Fixed a
    cross-reference that survived 4.0.0's renumbering: the code baseline was named as the floor for the
    claim-verification step rather than the history procedures, which is the narrowing 1.1.0 removed
  4.0.0 (2026-09-08): Rebuilt as a multi-pass, multi-model review — a single pass completes its census and is
    never exhaustive, because verification depth varies inside the claims it declared verified, and context
    budget was never the bottleneck; different models also miss different claims, so a review is now several
    passes across several models, each accumulating its own state. Breaking on the write surface and on
    verdict semantics: each model writes its own `findings-{model}.md` sink beside the report and may never
    read another model's, since cross-model independence is the whole source of the finding gain and a model
    that reads another's sink inherits its blind spots; finding IDs are namespaced per model so provenance
    survives consolidation; every pass section closes with a Not Opened note, because findings alone are a
    weak exclusion driver — "nothing reported" conflates checked-and-clean with never-opened — and the note
    is what makes hunting the previous pass's holes executable; the census is frozen by the first pass and
    reaches later models through the user, sinks counted separately being incomparable. VERIFIED no longer
    follows from a census covered in full, that verdict having been issued repeatedly before the next model
    found more: it now requires convergence, meaning every chartered model's last pass originated nothing
    new, and no Review pass issues a verdict at all. Reinstated modes, reversing 3.0.0's single-mode
    reduction deliberately rather than by oversight — Consolidate mode alone merges the sinks, analyses
    cross-model overlap, verifies the findings that drive the verdict including its own model's, applies the
    Finding Threshold, normalizes severity, writes the report and writes the review's one log entry, which a
    Review pass would otherwise deposit once per pass; the MODE line returns to the handoff block. Replaced
    the descriptive severity table with a derivational scale, since "actively misleading" and "significant
    context" are adjectives each model calibrates against its own priors: three questions in fixed order —
    the Finding Threshold as entry gate, whether the wrong action fails loudly or proceeds on a false
    premise, and whether the claim sits on an enforcing, navigated or orienting surface — feed a matrix onto
    the same three levels, every finding row records the two answers that produced its label so
    consolidation audits the derivation instead of re-arguing the label, and eight anchor findings carry the
    calibration that collapses cross-model variance. The scale stays inline rather than becoming a partial,
    having exactly one consumer; the Evaluation Dimensions table gave up its example column to it rather
    than stating the same examples twice
  3.1.0 (2026-09-08): Second reduction pass, run across this persona and the Manifest Curator together so
    the shared partials could be restructured — 58 constraints across the four shared procedure partials
    consolidated to 42 by merging the pairs that stated one obligation twice, and the changed-code
    intersection now owns the read-every-commit-in-full rule that claim verification also carried; the
    documentation-scope partial's two parallel five-row tables became one, and its finding table went from
    eighteen cells to three rows; the curation log's four entry-content constraints became one that points
    at the format block; no procedure, table or domain convention was dropped, and the reviewer's own
    content file is unchanged apart from its dangling reference to the manifest specification
  3.0.0 (2026-09-08): Reduction pass — the persona stated one obligation on up to ten surfaces, so each
    duplication cluster collapsed to a single canonical statement: the census, tier order, table-cell
    floor, baselines, origin marking and evidence pointers now live in the shared verification partial
    alone, and the Core Rules, checklist and workflow reference them instead of restating them; the
    Self-Validation Checklist dropped from 33 items to 5, keeping only the failures the pass has actually
    committed and the {n} convention that stops a box being ticked on intent; the workflow went from 23
    steps to 16; philosophy from 11 principles to 5, dropping the ones that had become rules elsewhere
    and the authoring-only "Durable Over Precise"; the Output Template's 14 summary fields folded to 9;
    the manifest specification reference is no longer included, since a reviewer that never writes a
    manifest needs only the Register Map, the CTX rule and the canonical filenames, now stated inline;
    the `agent` tool is withdrawn, having contradicted the standing prohibition on dispatching an owning
    agent; the handoff block no longer carries a MODE line, the persona having been single-mode since
    2.0.0 — the curation log's own `Review` mode field is unaffected
  2.0.1 (2026-09-08): Held read-only against the documentation-ownership triage that now lets other consumers
    of that table edit and dispatch — a reviewer that touches or delegates on the documents it falsifies stops
    being independent of them; the exemption is stated in the routing block rather than left implicit
  2.0.0 (2026-09-04): Removed sharding and Shard mode — dispatching a copy per document tripled the token
    cost to raise a coverage figure that turned out not to predict finding quality, and one session with a
    priority order is enough; added the Finding Threshold, since a pass reporting seventy-seven findings
    against a manifest in regular use was admitting every true observation and burying its own High rows
    under prose that misleads nobody; added External Review Integration, which verifies a CI reviewer's
    comments against source and treats the report as a complementary lens rather than a coverage target,
    after repeated comparisons showed the overlap between the two to be small in both directions
  1.3.0 (2026-09-03): Added the table-cell floor — sharding raised semantic coverage fifteenfold but the
    shards still under-spent on `Purpose` and `Description` cells, the densest wrong claims in a manifest
    and the ones a mechanical sweep waves through because the class they name exists; those cells are now
    cleared before any other semantic category, counted in the census, and reported as their own figure
    with every unchecked cell named individually
  1.2.0 (2026-09-03): A replay against a known finding set verified 310 claims of a 3351 census and missed
    all 11 known findings, every one of them in the semantic claims the pass never reached — so claims now
    split into a mechanical tier that runs to completion in bulk and a semantic tier that takes the whole
    remaining budget, since a cheap existence sweep raises the verified count while crowding out the
    checks that actually find things; added Sharded Verification, dispatching one copy of this persona per
    document so a large manifest gets a context window per document instead of one split across all of
    them, with the cross-document sweep and the omission scan kept in the aggregator where they are
    visible; added Shard mode so a dispatched copy verifies and returns rather than running a full pass
  1.1.0 (2026-09-03): A live review confirmed five external findings and originated none, so the pass now
    counts its denominator mechanically before verifying anything, rather than reporting the size of its
    own reading as the document's claim total; separated the code baseline from the documentation
    baseline, since bounding claim verification by the last logged commit narrowed a whole-manifest
    review to eight files; moved previously corrected facts to last in the verification order, where the
    rule against re-walking them had been contradicted by an ordering that put them first; the
    contradiction sweep now derives its subjects by command instead of checking a fixed list of
    constructs; findings are marked Originated or Confirmed so agreement cannot report as detection;
    Documentation Scope is resolved by command against the paths AGENTS.md routes to; checklist items
    phrased "every X" now carry a count
  1.0.0 (2026-09-03): Initial release — Audit mode split out of the Manifest Curator, since the pass that
    writes a document verified each sentence as it produced it and cannot independently test the claim;
    reviews run claim-first over a widened documentation scope, report per-dimension coverage, and
    distinguish a partial review from a pass

tools:
