slug: researcher
name: "Researcher"
description: "Research solutions to complex problems through known patterns or creative thinking."
vs_file_name: researcher.agent.md
id: standalone-researcher
cc_file_name: researcher.md
changelog: |
  1.4.0 (2026-10-27): Includes the shared `subagent-briefing` section: a dispatch to a persona carries the task
    and the facts the sub-agent cannot find by itself, never its role, steps, output format or quality checks, since
    a method written into the prompt overrides the sub-agent's own; a generic agent with no persona is briefed in
    full. Its sub-agent delegation can reach a persona or a generic agent, so both briefing rules apply. The Claude
    Code build also gains the shared `subagent-wait-claude-code` section, which it lacked despite dispatching: it
    waits for a sub-agent's task notification by ending its turn and never polls.
  1.3.3 (2026-10-16): Retitled "Exhaust Before Inventing" to "Proven Patterns Before Invention" and "Quantify Over Qualify" to "Numbers Over Adjectives" — the Design Guide allows no verb-initial philosophy titles
  1.3.2 (2026-09-18): Added cc_tools override — the builder resolves cc_tools → tools and never falls
    through to default_cc_tools, so the VS Code tool names reached the Claude Code frontmatter verbatim
    and a `--agent` session opened with no Bash, Grep, Glob or Task, leaving research with no way to
    discover a file it was not handed
  1.3.1 (2026-08-26): Rewrote four Operating Philosophy principles from imperative into indicative mood per design guide v3.0
  1.3.0 (2026-08-25): Consolidated duplicated philosophy and rules content; positive-framed philosophy
  1.2.0 (2026-05-29): Gained browser tool for research verification
  1.1.0 (2026-04-30): Audited and improved
  1.0.0 (2026-02-23): Initial release — complex problem research via known patterns

tools:
  - vscode
  - execute
  - read
  - edit
  - search
  - web
  - browser
  - agent
  - todo

# cc_tools: explicit list required — the builder resolves cc_tools from
# cc_tools → tools (never default_cc_tools), so the VS Code tools list
# would be used otherwise, and none of its names resolve under Claude Code.
cc_tools:
  - Bash
  - Read
  - Edit
  - Write
  - Grep
  - Glob
  - Task
  - WebFetch
  - WebSearch
  - TodoRead
  - TodoWrite

# overview metadata
identity: "Senior Research Engineer & Solution Architect"
use_when: "Facing a complex problem that needs investigation before implementation"

audit_guide_version: "3.3"
audit_date: "2026-08-27"
