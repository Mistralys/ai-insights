slug: changelog-curator
name: "Changelog Curator"
description: "Produce clean, scannable changelogs from Git history, rewrite verbose agent-generated entries into a concise house style, and archive older versions."
vs_file_name: changelog-curator.agent.md
id: standalone-changelog-curator
cc_file_name: changelog-curator.md
changelog: |
  1.7.2 (2026-10-19): Plainer wording for the archive-suggestion count in the shared archiving section
  1.7.1 (2026-10-16): Retitled "Merge Before Multiply" to "Logical Change Over Commit History" — the Design Guide allows no verb-initial philosophy titles
  1.7.0 (2026-10-16): Generate collects changes in a single `**WIP; UNRELEASED**` entry whose version is based
    on the changelog as it stood at the last release tag (shared wip-changelog-version partial); Rewrite
    finalizes a WIP entry for release — settles the version, replaces the marker with a title — via a new
    every-session checkpoint; SemVer integrity and the checklist allow the WIP version to move; Archive
    never archives a WIP entry or cuts on its version
  1.6.0 (2026-10-16): Added Archive mode — older minor series move verbatim into one file per series
    under docs/changelog-history/v{MAJOR}/ (or a location the project's docs name), with the cut rules,
    layout and verbatim-move rules in the new shared release-history-archiving partial so the WHATSNEW
    Curator archives on the same boundary; an archive footer links the newest archive file and is
    protected in Generate and Rewrite; Generate ends with a mechanical archive check (more than ten
    release headings, or an older major present) that always reports its count and only recommends an
    Archive session, never archives; the changelog path may also come from the
    project's docs; added the A Story Stays In One Place principle behind the judgment-based size cut
  1.5.1 (2026-09-18): Added cc_tools override — the builder resolves cc_tools → tools and never falls
    through to default_cc_tools, so the VS Code tool names reached the Claude Code frontmatter verbatim
    and a `--agent` session opened with no Bash, Grep, Glob or Task
  1.5.0 (2026-08-25): Design Guide v2.8 audit fixes — added Inputs with Capabilities, Operating Philosophy, Quality Checklist, Outputs with a location, and a WHATSNEW Curator scope boundary; fixed both modes writing before user approval; added a change inventory between history gathering and drafting; added conditional checkpoints for breaking/deprecation subsections and the file heading; restated style rules inside the Entry Format template; reordered sections and de-imperativised reference prose
  1.4.0 (2026-07-23): Added AX Feedback pre-handoff step via shared partial for agent experience self-reporting
  1.3.0 (2026-07-15): Added importance weighting and promoted-change bold sentence to summary rules
  1.2.0 (2026-07-15): Added release summary feature — optional prose paragraph with house style rules
  1.1.1 (2026-03-04): Added persona ID field for VS Code agent registry
  1.1.0 (2026-02-25): Refined entry verbosity rationales
  1.0.0 (2026-02-24): Initial release — Git-to-changelog summarization with house style

tools:
  - vscode
  - execute
  - read
  - edit
  - search
  - agent
  - todo

# cc_tools: explicit list required — the builder resolves cc_tools from
# cc_tools → tools (never default_cc_tools), so the VS Code tools list
# would be used otherwise, and none of its names resolve under Claude Code.
# No WebFetch/WebSearch, matching the vs-code grant (no `web` tool).
cc_tools:
  - Bash
  - Read
  - Edit
  - Write
  - Grep
  - Glob
  - Task
  - TodoRead
  - TodoWrite

audit_guide_version: "3.2"
audit_date: "2026-08-26"

# overview metadata
identity: "Release Communications Editor"
use_when: "Preparing a release, cleaning up verbose agent-generated changelog entries"
modes: |
  Generate (from Git history)
  Rewrite (clean up existing entries)
  Archive (move older versions to the changelog history)
