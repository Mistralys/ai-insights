slug: plan-refiner
name: "Plan Refiner"
description: "Orchestrate iterative plan refinement: architectural review, finding integration, and repeated auditing until audit-clean or ceiling reached."
vs_file_name: plan-refiner.agent.md
id: standalone-plan-refiner
cc_file_name: plan-refiner.md
changelog: |
  1.10.0 (2026-10-28): The Plan Architect Reviewer, Plan Auditor and Usage Scenarios Curator dispatches now pass the
    output path (`design-review.md`, `audit.md`, `scenario-coverage.md` under `{PLAN_DIR}`) on every target. The
    shared `subagent-briefing` section now has a dispatch prompt name the file the next step reads the sub-agent's
    result from: the output file is part of the task, not the method. Without it, Claude Code's own note telling sub-
    agents to return findings as a reply wins, as it did for a Plan Auditor on 2026-10-28 that skipped `audit.md`.
  1.9.0 (2026-10-27): Includes the shared `subagent-briefing` section: a dispatch to a persona carries the task
    and the facts the sub-agent cannot find by itself, never its role, steps, output format or quality checks. The
    re-audit differential summary now carries facts only (cycle number, previous finding counts and severities,
    modified sections); the instruction to prioritize changed areas moved into the Plan Auditor, which owns how it
    weights verification.
  1.8.0 (2026-10-26): Claude Code build includes the shared `subagent-wait-claude-code` section: every dispatch
    runs in the background, so the persona waits for a sub-agent's task notification by ending its turn, never
    polls or waits on a file it expects, and passes neither `name` nor `run_in_background`. The Project Manager
    hung for up to 40 hours on an invented wait loop, and named dispatches started teammates outside the dispatcher's task, whose results never arrived,
    told to report through a `SendMessage` tool they never had; a second launch failure follows the calling step's own
    failure handling
  1.7.2 (2026-09-29): Removed `web` from VS Code `tools` — the persona's `cc_tools` already document
    "no web access" and its content contains no fetch/URL instruction, so the VS Code grant exceeded
    Claude Code's without cause
  1.7.1 (2026-09-29): Claude Code sub-agent dispatches now pass `subagent_type` with the agent's slug — the name sat
    in `description`, which starts a persona-less general-purpose agent; deep-agents dispatches gained their own
    branch, and `1-planner` joined the `subagents` list.
    VS Code `agentName` for the ledger Planner is now `1 - Planner v…`, its real frontmatter name —
    `{{agent_1_planner}}` rendered `1-planner v…`, which VS Code matches to no agent
  1.7.0 (2026-09-25): Cross-model pass tracking — a Pass Identification step at session start reads the
    plan's `## Plan Audit Cycles` labels, derives this session's pass label, and classifies the session as
    first pass, continuation, or cross-model; a cross-model session deletes all three review artifacts
    before any phase runs, and every Planner dispatch now names the label so the counters stay attributable.
    Granted Bash and Edit under Claude Code, bringing artifact deletion and Phase 1 brief enrichment into
    parity with the VS Code build; plan.md is now held by an explicit constraint rather than by the
    absence of a write tool
  1.6.2 (2026-09-10): Added cc_tools override — Read, Grep, Glob, Task, TodoRead, TodoWrite; Task required for subagent dispatch
  1.6.1 (2026-08-26): Rewrote the Token Economy philosophy principle into indicative mood per design guide v3.0
  1.6.0 (2026-08-25): Design Guide v2.8 re-audit fixes — Phase 5 brought up to the structural standard of Phases 2–4 with stale-artifact deletion and write confirmation, the compound scenario step split into three single-delegation steps, a missing-artifact halt constraint added, the filesystem capability narrowed so it no longer authorizes plan writes, a max-audit-cycles bound check added to step 1, and CEILING_REACHED spelling unified with the emitted status token
  1.5.0 (2026-08-25): Design Guide v2.8 compliance — added an explicit divergence-comparison step to the audit loop, declared the INCOMPLETE terminal status, consolidated protocol constraints under their own headings, folded the scenario check in as Phase 5, and split the compound scenario workflow step
  1.4.0 (2026-08-18): Added opt-in post-convergence usage scenario verification with GUI-scope exception handling and a bounded integration re-check
  1.3.0 (2026-07-21): Moved research brief handling to sub-agent personas — Auditor and Architect Reviewer now self-manage brief usage; simplified dispatch prompts and removed Sub-Agent Brief Enrichment protocol and brief size guard from Refiner
  1.2.1 (2026-07-21): Operating Philosophy rewrite — replaced constraint-like prohibitions with positive value statements; removed items already covered by Strict Constraints
  1.2.0 (2026-07-21): Refiner-as-Enricher — brief enrichment phase, enriched sub-agent dispatch prompts with research brief references, incremental re-audit for cycles 2+, sub-agent brief enrichment with provenance markers, brief size guard
  1.1.0 (2026-07-17): Design review triage — auto-detect whether the plan warrants architectural review; skip for plans with no design decisions
  1.0.4 (2026-05-31): Minor refinements
  1.0.3 (2026-05-20): Handoff improvements to give subagents more agency
  1.0.2 (2026-05-20): Wording improvements to remove overly imperative instructions
  1.0.0 (2026-05-20): Initial release — iterative plan refinement with repeated auditing

tools:
  - vscode
  - execute
  - read
  - edit
  - search
  - agent
  - todo

# cc_tools differs from default: Plan Refiner reads plan files and dispatches subagents —
# no Write, no web access. Task is required for subagent dispatch. Bash deletes stale review
# artifacts (audit.md, design-review.md, scenario-coverage.md) for Phases 2, 4 and 5 and the
# cross-model reset; Edit appends enrichment to research-brief.md in Phase 1. Both match the
# VS Code tool list. plan.md stays the Planner's to write — enforced by the "Never write to
# plan.md" constraint in the persona, not by withholding the tool.
cc_tools:
  - Bash
  - Edit
  - Read
  - Grep
  - Glob
  - Task
  - TodoRead
  - TodoWrite

subagents:
  - 1-planner
  - plan-architect-reviewer
  - plan-auditor
  - usage-scenarios-curator

audit_guide_version: "3.2"
audit_date: "2026-08-26"

# overview metadata
identity: "Plan Quality Director"
use_when: "You want a plan to go through multiple rounds of review and refinement automatically"
